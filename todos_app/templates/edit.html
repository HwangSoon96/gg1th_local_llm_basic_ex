{% extends 'base.html' %}

{% block content %}
    <section class="page-intro">
        <a class="back-link" href="/">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            목록으로
        </a>
        <h1 class="page-title">할 일 고치기</h1>
    </section>

    <form class="composer" action="/edit/{{todo.id}}" method="post">
        <label class="sr-only" for="edit-task">할 일 내용</label>
        <textarea name="task" id="edit-task" rows="5">{{todo.task}}</textarea>

        <label class="check-row" for="completed">
            <input type="checkbox" name="completed" id="completed" {% if todo.completed %}checked{% endif %}>
            <span class="check-box" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
                     stroke="currentColor" stroke-width="3.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </span>
            <span class="check-label">다 했어요</span>
        </label>

        <div class="composer-foot form-actions">
            <a class="btn btn-ghost" href="/">취소</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
    <!-- 미션: 아래쪽에 데이터 목록이 보이도록 만들기 -->
    <section class="task-section" aria-labelledby="task-heading">
        <h2 class="section-title" id="task-heading">할 일</h2>

        <ul class="task-list task-list-main">
        {% for todo in todos %}
        <li class="task{% if todo.completed %} is-done{% endif %}" style="--i: {{ loop.index0 }}">
            <span class="task-dot" aria-hidden="true"></span>
            <span class="task-text">{{ todo.task }}</span>
            <span class="task-actions">
                <a class="todo-btn" href="/edit/{{ todo.id }}">수정</a>
                <form action="/delete/{{ todo.id }}" method="post"
                      onsubmit="return confirm('이 할 일을 삭제할까요? 되돌릴 수 없어요.')">
                    <button class="todo-btn todo-btn-danger" type="submit">삭제</button>
                </form>
            </span>
        </li>
        {% endfor %}
        </ul>

        <!-- 카운터 집계를 위해 목록 다음에 둡니다 -->
        <p class="task-stat"></p>
    </section>

{% endblock content %}
