{% extends 'base.html' %}  <!-- 부모페이지로 부터 상속을 받는다는 의미 -->
{% block content %}   <!-- override 자식페이지에서 재정의 하는 블럭 -->
    <section class="page-intro">
        <h1 class="page-title">오늘 뭐 할까요</h1>
        <p class="page-sub">적어두고 하나씩 지워나가요</p>
    </section>

    <form class="composer" action="/add" method="post" data-add-form>
        <label class="sr-only" for="task">할 일 내용</label>
        <!-- <textarea name="task" rows="5" placeholder="Enter your task" id="task" required></textarea> -->
        <textarea name="task" rows="5" placeholder="예) 자료구조 3장 복습하기" id="task"></textarea>
        <div class="composer-foot">
            <span class="composer-hint" aria-hidden="true">
                <kbd class="kbd">Ctrl</kbd><kbd class="kbd">Enter</kbd>
            </span>
            <button class="btn btn-primary" type="submit" id="add_task">
              추가하기
            </button>
        </div>
    </form>

    <section class="task-section" aria-labelledby="tasks-heading">
        <h2 class="section-title" id="tasks-heading">할 일</h2>

        <!-- 필터 — 화면에서만 걸러냅니다 (서버 요청 없음) -->
        <div class="filters" data-filters role="group" aria-label="목록 거르기">
            <button class="filter-btn is-on" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="filter-btn" type="button" data-filter="done" aria-pressed="false">완료</button>
        </div>

        <ul class="task-list task-list-main" data-list>
            {% for todo in todos %}
            <li class="task{% if todo.completed %} is-done{% endif %}"
                data-id="{{ todo.id }}"
                data-task="{{ todo.task }}"
                data-done="{% if todo.completed %}1{% else %}0{% endif %}"
                style="--i: {{ loop.index0 }}">

                <!-- 완료 토글: JS 없으면 그냥 폼 전송으로 동작 -->
                <form class="toggle-form" action="/edit/{{ todo.id }}" method="post" data-toggle-form>
                    <input type="hidden" name="task" value="{{ todo.task }}">
                    {% if not todo.completed %}<input type="hidden" name="completed" value="true">{% endif %}
                    <button class="toggle" type="submit"
                            aria-pressed="{% if todo.completed %}true{% else %}false{% endif %}"
                            aria-label="완료 표시 전환">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none"
                             stroke="currentColor" stroke-width="3.5"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 6 9 17l-5-5"/>
                        </svg>
                    </button>
                </form>

                <span class="task-text" data-text tabindex="0" role="button"
                      aria-label="{{ todo.task }} — 눌러서 이름 바꾸기">{{ todo.task }}</span>

                <span class="task-actions">
                    <a class="todo-btn" href="/edit/{{ todo.id }}">수정</a>
                    <!-- JS가 켜지면(js-on) 확인창 대신 실행 취소 토스트를 씁니다.
                         동기화로 새로 꿂힌 행에서도 같은 조건이 먹도록 전역 플래그를 봅니다. -->
                    <form action="/delete/{{ todo.id }}" method="post" data-delete-form
                          onsubmit="return document.documentElement.classList.contains('js-on') || confirm('이 할 일을 삭제할까요? 되돌릴 수 없어요.')">
                        <button class="todo-btn todo-btn-danger" type="submit">삭제</button>
                    </form>
                </span>
            </li>
            {% endfor %}
        </ul>

        <!-- 카운터 집계를 위해 목록 다음에 둡니다 (화면엔 grid로 제목 옆에 표시) -->
        <p class="task-stat"></p>
    </section>

    <p class="hint-bar">
        <kbd class="kbd">?</kbd> 를 누르면 단축키를 볼 수 있어요
    </p>
{% endblock content %}  <!-- override 자식페이지에서 재정의 하는 블럭 -->
