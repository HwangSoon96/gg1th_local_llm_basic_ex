<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="오늘 할 일을 기록하고 하나씩 지워나가는 메모">
    <meta name="color-scheme" content="light dark">
    <title>나를 성장시키는 메모</title>

    <!-- 테마를 그리기 전에 미리 적용 — 새로고침 때 흰 화면이 번쩍이는 걸 막습니다 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>

    <!-- Pretendard: 한글 UI에 최적화된 웹폰트 (dynamic subset — 쓰는 글자만 내려받음) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <!-- 스크롤해도 따라오는 유리 느낌 헤더 -->
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="3.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>
                </span>
                <span class="brand-name">나를 성장시키는 메모</span>
            </a>

            <div class="header-tools">
                <!-- 진행률 링 — 완료 비율만큼 테두리가 찹니다 -->
                <span class="progress-ring" data-ring hidden>
                    <svg viewBox="0 0 36 36" width="30" height="30" aria-hidden="true">
                        <circle class="ring-track" cx="18" cy="18" r="15"/>
                        <circle class="ring-fill"  cx="18" cy="18" r="15" data-ring-fill/>
                    </svg>
                    <span class="ring-label" data-ring-label>0%</span>
                    <span class="sr-only" data-ring-sr role="status"></span>
                </span>

                <button class="icon-btn" type="button" data-palette-open
                        aria-label="명령 팔레트 열기 (Ctrl+K)" title="명령 팔레트 (Ctrl+K)">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                </button>

                <button class="icon-btn" type="button" data-theme-toggle
                        aria-label="테마 전환" title="테마 전환">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.2"/>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <!-- 알림 토스트가 쌓이는 자리 -->
    <div class="toast-region" data-toasts role="region" aria-live="polite" aria-label="알림"></div>

    <!-- 명령 팔레트 (Ctrl+K) -->
    <dialog class="palette" data-palette aria-label="명령 팔레트">
        <div class="palette-box">
            <div class="palette-head">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                </svg>
                <input class="palette-input" type="text" data-palette-input
                       placeholder="할 일 검색, 또는 명령 실행" aria-label="검색어 또는 명령"
                       autocomplete="off" spellcheck="false">
                <kbd class="kbd">Esc</kbd>
            </div>
            <ul class="palette-list" data-palette-list role="listbox" aria-label="결과"></ul>
            <p class="palette-empty" data-palette-empty hidden>결과가 없어요</p>
        </div>
    </dialog>

    <!-- 단축키 안내 (?) -->
    <dialog class="sheet" data-shortcuts aria-label="단축키 안내">
        <div class="sheet-box">
            <h2 class="sheet-title">단축키</h2>
            <dl class="shortcut-list">
                <dt><kbd class="kbd">/</kbd></dt><dd>입력창으로 이동</dd>
                <dt><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></dt><dd>명령 팔레트</dd>
                <dt><kbd class="kbd">J</kbd><kbd class="kbd">K</kbd></dt><dd>항목 이동</dd>
                <dt><kbd class="kbd">X</kbd></dt><dd>완료 표시 전환</dd>
                <dt><kbd class="kbd">E</kbd></dt><dd>이름 바꾸기</dd>
                <dt><kbd class="kbd">Ctrl</kbd><kbd class="kbd">Enter</kbd></dt><dd>추가하기</dd>
                <dt><kbd class="kbd">T</kbd></dt><dd>테마 전환</dd>
                <dt><kbd class="kbd">?</kbd></dt><dd>이 창 열기</dd>
            </dl>
            <button class="btn btn-ghost" type="button" data-sheet-close>닫기</button>
        </div>
    </dialog>

    <script src="/static/js/app.js" defer></script>
</body>
</html>
